experiment_name: "visec_cross_eval_ravdess"

# ============================================================================
# Cross-Dataset Generalization Experiment
#   Train: ViSEC (Vietnamese SER dataset)
#   Test:  RAVDESS (English SER dataset) — filtered to 4 shared emotion classes
#
# Shared emotion classes (ViSEC label order):
#   0 = happy | 1 = neutral | 2 = sad | 3 = angry
#
# Purpose: Measure how well the model trained on Vietnamese speech generalizes
#          to English speech with the same 4 emotion categories.
# ============================================================================

dataset:
  name: "visec"
  test_on: "ravdess"             # ← Train on ViSEC, Test on RAVDESS

  args:
    hf_id: "hustep-lab/ViSEC"
    ravdess_hf_id: "TwinkStart/RAVDESS"
    batch_size: 8
    num_workers: 4
    target_size: [224, 224]
    spec_augment:
      freq_mask_param: 27
      time_mask_param: 30
      num_freq_masks: 1
      num_time_masks: 2
      prob: 0.5
    waveform_augment:
      prob: 0.7
      pitch_shift:
        weight: 0.4
        n_steps_range: [-1.0, 1.0]
      noise_injection:
        weight: 0.4
        noise_factor_range: [0.001, 0.015]
      time_shift:
        weight: 0.2
        range: [0.9, 1.1]

model:
  name: "maxmvit_mlp"
  type: "gmu"                    # options:
                                  #   Dual-backbone (fusion): original | gmu | crossattn
                                  #   Single-backbone (ablation): maxvit_unimodal | mvitv2_unimodal
  num_classes: 4                  # Must be 4 (shared class count)
  hidden_size: 512
  dropout_rate: 0.3
  num_heads: 8
  fusion_type: "concat"

training:
  epochs: 50
  lr: 0.0002
  backbone_lr: 0.0001
  head_lr: 0.0005
  patience: 10
  seed: 42
  device: "cuda"
  checkpoint_metric: "macro_f1"
  scheduler:
    type: "cosine"
    min_lr: 1e-6
    warmup_epochs: 3

# ============================================================================
# Auxiliary Task: Region Recognition (RR Loss) — ViSEC only
# ============================================================================
auxiliary_task:
  enabled: true
  task: "accent"
  num_accent_classes: 3
  alpha: 0.8
  accent_weights: [0.2, 0.56, 2.24]

paths:
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
