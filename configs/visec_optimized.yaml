experiment_name: "visec_optimized"

# ============================================================================
# Optimized config for ViSEC, applying (in priority order):
#   1. Better evaluation: checkpoint selection by macro-F1 + class-weighted loss
#   2. Overfitting control: discriminative LR, higher dropout, label smoothing, AMP
#   3. Fusion ablation left as a knob (model.type) to test after 1-2 are stable
#   4. Augmentation / scheduler as the last, marginal-gain tuning step
# See README / conversation notes for the reasoning behind each change.
# ============================================================================

dataset:
  name: "visec"
  args:
    hf_id: "hustep-lab/ViSEC"
    batch_size: 4                  # 4 per GPU to prevent CUDA OOM on T4 (15GB) with dual backbones
    num_workers: 4
    split_ratio: [0.8, 0.1, 0.1]   # 80% Train, 10% Val, 10% Test (Scientific paper standard)
    target_size: [224, 224]        # was [244,244]: model always interpolates to 224 anyway,
                                    # so requesting 224 directly skips a wasted resize step
    spec_augment:
      freq_mask_param: 27
      time_mask_param: 30          # was 30/100: middle ground, paired with 2 masks below
      num_freq_masks: 1
      num_time_masks: 2            # was 1: two smaller masks generalize better than one big one
      prob: 0.5
    waveform_augment:
      prob: 0.7                    # was 0.6: slightly more augmentation for a small dataset
      pitch_shift:
        weight: 0.4
        n_steps_range: [-1.0, 1.0]  # kept conservative: Vietnamese is tonal, large pitch
                                     # shifts risk changing the lexical/emotional meaning
      noise_injection:
        weight: 0.4
        noise_factor_range: [0.001, 0.015]
      time_shift:
        weight: 0.2
        range: [0.9, 1.1]

model:
  name: "maxmvit_mlp"
  type: "gmu"                # options:
                                    #   Dual-backbone (fusion): original | gmu | crossattn
                                    #   Single-backbone (ablation): maxvit_unimodal | mvitv2_unimodal
  num_classes: 4
  hidden_size: 512
  dropout_rate: 0.3                # was 0.2: extra regularization, ~170M params on a
                                    # likely-small dataset is prone to overfitting
  num_heads: 8
  fusion_type: "concat"            # try "gated" as a follow-up ablation

 
training:
  epochs: 50                       # 50 epochs
  patience: 10                     # Early stopping patience
  seed: 42
  device: "cuda"

  # Fallback learning rate
  lr: 0.0002

  # --- Discriminative learning rates ---
  backbone_lr: 0.0001             # Lower LR for pretrained MaxViT & MViTv2
  head_lr: 0.0005                  # Higher LR for GMU fusion & classification heads

  # --- Acceleration & Regularization ---
  amp: true                        # Automatic Mixed Precision (FP16) - cuts VRAM by 50% and speeds up training
  label_smoothing: 0.05            # Regularization against overfitting
  class_weight: true               # Dynamic class weighting for balanced loss
  grad_clip_norm: 1.0              # Gradient clipping to prevent gradient explosion

  # --- Checkpoint selection (NEW) ---
  checkpoint_metric: "macro_f1"    # was implicitly val_acc: macro_f1 is robust to
                                    # class imbalance in ViSEC's emotion/accent labels

  scheduler:
    type: "cosine"                 # was ReduceLROnPlateau: smoother decay, works well
                                    # for ViT fine-tuning with few steps/epoch on small data
    min_lr: 1e-6
    warmup_epochs: 3

# ============================================================================
# Auxiliary Task: Region Recognition (RR Loss)
# Multi-task learning for Region/Accent + Emotion recognition
# ============================================================================
auxiliary_task:
  enabled: true                    # Enable Region Recognition (RR) Auxiliary Loss
  task: "accent"
  num_accent_classes: 3            # 3 regions: North (0), South (1), Mid (2)
  alpha: 0.8                       # Weight for RR loss: Total_Loss = Loss_emo + alpha * Loss_RR
  accent_weights: [0.2, 0.56, 2.24] # Or manually specify per-region loss weights list if preferred

paths:
  log_dir: "logs"
  checkpoint_dir: "checkpoints"

