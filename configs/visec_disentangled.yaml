experiment_name: "visec_disentangled"

# ============================================================================
# Disentangled Representation Learning config for ViSEC
# Based on visec_optimized.yaml + Shared-Private Decomposition + 3-Way GMU
# ============================================================================

dataset:
  name: "visec"
  args:
    hf_id: "hustep-lab/ViSEC"
    batch_size: 4                  # 4 per GPU to prevent CUDA OOM on T4 (15GB)
    num_workers: 4
    split_ratio: [0.8, 0.1, 0.1]   # 80% Train, 10% Val, 10% Test
    target_size: [224, 224]
    spec_augment:
      freq_mask_param: 27
      time_mask_param: 30
      num_freq_masks: 1
      num_time_masks: 2
      prob: 0.5
    waveform_augment:
      prob: 0.7
      pitch_shift:
        weight: 0.4
        n_steps_range: [-1.0, 1.0]
      noise_injection:
        weight: 0.4
        noise_factor_range: [0.001, 0.015]
      time_shift:
        weight: 0.2
        range: [0.9, 1.1]

model:
  name: "maxmvit_mlp"
  type: "disentangled"             # <<< NEW: Shared-Private Decomposition + 3-Way GMU
  backbone_size: "tiny"            # Start with tiny for fast iteration, switch to 'base' for paper
  num_classes: 4
  hidden_size: 512
  dropout_rate: 0.3
  sub_dim: 256                     # Dimension of shared/private subspaces (d)

training:
  epochs: 50
  patience: 10
  seed: 42
  device: "cuda"

  # Fallback learning rate
  lr: 0.0002

  # --- Discriminative learning rates ---
  backbone_lr: 0.0001             # Lower LR for pretrained MaxViT & MViTv2
  head_lr: 0.0005                  # Higher LR for Disentanglers + GMU + MLP + Heads

  # --- Acceleration & Regularization ---
  amp: true
  label_smoothing: 0.05
  class_weight: true
  grad_clip_norm: 1.0

  # --- Checkpoint selection ---
  checkpoint_metric: "macro_f1"

  scheduler:
    type: "cosine"
    min_lr: 1e-6
    warmup_epochs: 3

# ============================================================================
# Auxiliary Task: Region Recognition (from h_cqt_private)
# In the disentangled model, accent head is fed by h_cqt_private directly,
# exploiting CQT's high-resolution F0/tonal information for dialect detection.
# ============================================================================
auxiliary_task:
  enabled: true
  task: "accent"
  num_accent_classes: 3            # 3 regions: North (0), South (1), Mid (2)
  alpha: 0.6                       # Slightly reduced from 0.8: h_cqt_p is already specialized
  accent_weights: [0.2, 0.56, 2.24]

# ============================================================================
# Disentanglement Constraints (The Constraint Triangle)
#   L_total = L_emo + α*L_accent + β*L_recon + γ*L_sim + δ*L_orth
#
# These are regularizers; their gradient contribution should be ~10-15% of total.
# warmup_epochs: gradually increase from 0 to target weight over N epochs,
#   allowing backbones to stabilize before applying structural constraints.
# ============================================================================
disentangle:
  enable: true
  beta_recon: 0.1                  # L_recon: MSE self-reconstruction (preserves info in h_p)
  gamma_sim: 0.05                  # L_sim: Cosine distance between shared components
  delta_orth: 0.05                 # L_orth: Batch-level cross-covariance Frobenius norm
  warmup_epochs: 5                 # Linear warm-up: 0 → target over first 5 epochs

paths:
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
